<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Programmes</title>

    <link rel="stylesheet"
          th:href="@{/css/training.css}">
</head>

<body>

<main class="programmes-page">

    <header class="programmes-header">

        <a class="back-link"
           th:href="@{/}">
            &larr; Home
        </a>

        <h1>Programmes</h1>

        <p>Select a training programme</p>

    </header>

    <form th:action="@{/programmes/upload}"
          method="post"
          enctype="multipart/form-data"
          class="upload-form">

        <label class="upload-file">

            <span>Choose programme YAML</span>

            <input type="file"
                   name="file"
                   accept=".yaml,.yml"
                   required>

        </label>

        <button type="submit"
                class="upload-button">
            Upload programme
        </button>

    </form>

    <nav class="programme-list"
         aria-label="Training programmes"
         th:if="${!#lists.isEmpty(programmes)}">

        <a class="programme-card"
           th:each="programme : ${programmes}"
           th:href="@{/programmes/{programmeId}(
               programmeId=${programme.id}
           )}">

            <span class="programme-card-title"
                  th:text="${programme.name}">
                Strength and Conditioning
            </span>

            <span class="programme-card-detail"
                  th:text="|${#lists.size(programme.weeks)} weeks|">
                4 weeks
            </span>

            <span class="programme-card-action">
                View programme
            </span>

        </a>

    </nav>

    <section class="empty-message"
             th:if="${#lists.isEmpty(programmes)}">

        <h2>No programmes available</h2>

        <p>Upload a programme to begin training.</p>

    </section>

</main>

</body>
</html>
