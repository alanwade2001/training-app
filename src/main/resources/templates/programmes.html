<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Programmes</title>

    <link rel="stylesheet"
          th:href="@{/css/training.css}">
</head>

<body>

<main class="page programmes-page">

    <header class="page-header programmes-header">

        <a class="back-link"
           th:href="@{/}">
            &larr; Home
        </a>

        <h1 class="page-title">
            Programmes
        </h1>

        <p class="page-description">
            Select a training programme
        </p>

    </header>


    <details class="upload-panel"
             th:attr="open=${uploadErrors != null} ? 'open' : null">

        <summary class="upload-toggle">
            Upload programme
        </summary>

        <div class="upload-errors"
             th:if="${uploadErrors != null}">
            <ul>
                <li th:each="error : ${uploadErrors}"
                    th:text="${error}">
                    Validation error
                </li>
            </ul>
        </div>

        <form class="upload-form"
              th:action="@{/programmes/upload}"
              method="post"
              enctype="multipart/form-data">

            <label class="upload-file">

                <span>Programme YAML</span>

                <input type="file"
                       name="file"
                       accept=".yaml,.yml"
                       required>

            </label>

            <button type="submit"
                    class="button button-primary upload-button">
                Upload
            </button>

        </form>

    </details>

    <nav class="programme-list"
         aria-label="Training programmes"
         th:if="${!#lists.isEmpty(programmes)}">

        <a class="card programme-card"
           th:each="programme : ${programmes}"
           th:href="@{/programmes/{programmeId}(
               programmeId=${programme.id}
           )}">

            <span class="card-title programme-card-title"
                  th:text="${programme.name}">
                Strength and Conditioning
            </span>

            <span class="programme-card-detail"
                  th:text="|${#lists.size(programme.weeks)} weeks|">
                4 weeks
            </span>

            <span class="programme-card-action">
                View programme
            </span>

        </a>

    </nav>

    <section class="empty-state"
             th:if="${#lists.isEmpty(programmes)}">

        <h2>No programmes available</h2>

        <p>Upload a programme to begin training.</p>

    </section>

</main>

</body>
</html>
