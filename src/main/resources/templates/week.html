<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="|Week ${week.number} - ${programme.name}|">
        Programme Week
    </title>

    <link rel="stylesheet"
          th:href="@{/css/training.css}">
</head>

<body>

<main class="page week-page">

    <header class="page-header week-header">

        <a class="back-link"
           th:href="@{/programmes/{programmeId}(
               programmeId=${programme.id}
           )}">
            &larr; Programme
        </a>

        <p class="programme-name"
           th:text="${programme.name}">
            Strength and Conditioning
        </p>

        <h1 class="page-title">
            Week
            <span th:text="${week.number}">1</span>
        </h1>

        <p class="page-description week-progress">
            <strong th:text="${completedWorkouts}">2</strong>
            of
            <strong th:text="${#lists.size(workouts)}">3</strong>
            workouts done
        </p>

    </header>

    <section class="workout-list"
             aria-label="Workouts"
             th:if="${!#lists.isEmpty(workouts)}">

        <article class="card workout-card"
                 th:each="item : ${workouts}"
                 th:classappend="${item.done}
                     ? 'workout-card-complete'
                     : ''">

            <div class="workout-schedule">

                <span class="workout-complete"
                      th:if="${item.done}"
                      aria-label="Workout complete">
                    &#10003;
                </span>

                <span class="workout-day"
                      th:text="${#strings.capitalize(
                          #strings.toLowerCase(
                              item.workout.dayOfWeek.toString()
                          )
                      )}">
                    Monday
                </span>

            </div>

            <h2 class="card-title workout-name"
                th:text="${item.workout.name}">
                Force &amp; Reactive
            </h2>

            <p class="exercise-count"
               th:if="${item.workout.exercises != null}"
               th:text="|${#lists.size(item.workout.exercises)} exercises|">
                6 exercises
            </p>

            <p class="workout-session-count"
               th:if="${item.sessionCount > 0}"
               th:text="${item.sessionCount == 1
                   ? '1 attempt'
                   : item.sessionCount + ' attempts'}">
                2 attempts
            </p>

            <p class="workout-completion-count"
               th:if="${item.completedSessionCount > 0}"
               th:text="${item.completedSessionCount == 1
                   ? 'Completed once'
                   : 'Completed ' + item.completedSessionCount + ' times'}">
                Completed once
            </p>

            <a th:href="@{/programmes/{programmeId}/weeks/{weekNumber}/workouts/{workoutId}(
                programmeId=${programme.id},
                weekNumber=${week.number},
                workoutId=${item.workout.id}
            )}">
                Preview
            </a>



        </article>

    </section>

    <section class="empty-state"
             th:if="${#lists.isEmpty(workouts)}">

        <p>
            There are no workouts configured for this week.
        </p>

    </section>

    <footer class="week-footer">



    </footer>

</main>

</body>
</html>
