<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Training</title>

    <link rel="stylesheet"
          th:href="@{/css/training.css}">
</head>

<body>

<main class="page home-page">

    <header class="page-header home-header">

        <h1 class="page-title">
            Training
        </h1>

        <p class="page-description">
            Choose how you want to train
        </p>

    </header>

    <nav class="home-options"
         aria-label="Training options">

        <a class="card home-card"
           th:href="@{/programmes}">

            <span class="card-title home-card-title">
                Programmes
            </span>

            <span class="home-card-description">
                Select your training programme
            </span>

        </a>

        <a class="card home-card"
           th:href="@{/workouts}">

            <span class="card-title home-card-title">
                Workouts
            </span>

            <span class="home-card-description">
                Choose a workout directly
            </span>

        </a>

        <a class="card home-card"
           th:href="@{/history}">

            <span class="card-title home-card-title">
                History
            </span>

            <span class="home-card-description">
                View history
            </span>

        </a>

    </nav>

</main>

</body>
</html>
