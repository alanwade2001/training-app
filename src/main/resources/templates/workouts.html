<!doctype html>
<html lang="en-IE"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Workouts</title>

    <link rel="stylesheet"
          th:href="@{/css/training.css}">
</head>

<body>

<main class="page workouts-page">

    <header class="page-header workouts-header">

        <a class="back-link"
           th:href="@{/}">
            &larr; Home
        </a>

        <h1 class="page-title">
            Workouts
        </h1>

        <p class="page-description">
            Select a workout
        </p>

    </header>

    <details class="upload-panel"
             th:attr="open=${uploadErrors != null || uploadError != null} ? 'open' : null">

        <summary class="upload-toggle">
            Upload workout
        </summary>

        <div class="upload-errors"
             th:if="${uploadErrors != null || uploadError != null}"
             role="alert">

            <strong>Workout could not be uploaded</strong>

            <p th:if="${uploadError != null}"
               th:text="${uploadError}">
                The file could not be uploaded.
            </p>

            <ul th:if="${uploadErrors != null}">

                <li th:each="error : ${uploadErrors}"
                    th:text="${error.message}">
                    Recovery must be greater than or equal to 15.
                </li>

            </ul>

        </div>

        <form class="upload-form"
              th:action="@{/workouts/upload}"
              method="post"
              enctype="multipart/form-data">

            <label class="upload-file">

                <span>Workout YAML</span>

                <input type="file"
                       name="file"
                       accept=".yaml,.yml"
                       required>

            </label>

            <button type="submit"
                    class="button button-primary upload-button">
                Upload
            </button>

        </form>

    </details>

    <section class="workout-list"
             aria-label="Available workouts"
             th:if="${!#lists.isEmpty(workouts)}">

        <article class="card workout-card"
                 th:each="workout : ${workouts}">

            <h2 class="card-title workout-name"
                th:text="${workout.name}">
                Heavy Force
            </h2>

            <p class="workout-meta">
                <span th:text="${#lists.size(workout.exercises)}">
                    3
                </span>
                exercises
            </p>

            <form th:action="@{/sessions}"
                  method="post">

                <input type="hidden"
                       name="workoutId"
                       th:value="${workout.id}">

                <button type="submit"
                        class="button button-primary workout-button">
                    Start workout
                </button>

            </form>

        </article>

    </section>

    <section class="empty-state"
             th:if="${#lists.isEmpty(workouts)}">

        <h2>No workouts available</h2>

        <p>
            Upload a workout to begin training.
        </p>

    </section>

</main>

</body>
</html>
